name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 讀取 package.json 的 packageManager 欄位安裝對應 pnpm 版本（與 CI 一致）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-enhance-extension
          path: dist/
          retention-days: 30

      - name: Packaging extension
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          zip -r ../chrome-network-enhance.zip .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: chrome-network-enhance.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
